{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 p-4">
                <h2 class="mb-4 text-center">Add New Task</h2>
                <form method="post">
                    <div class="mb-3">
                        <label for="content" class="form-label fw-bold">Task Content</label>
                        <textarea name="content" class="form-control" rows="3" placeholder="What needs to be done?"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label fw-bold">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
