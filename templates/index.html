{% extends 'base.html' %}

{% block content %}
    <div class="row">
        {% for task in tasks %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 h-100 modern-card">
                    <div class="card-body">
                        <h5 class="card-title">{{ task['content'] }}</h5>
                        <span class="badge 
                            {% if task['priority'] == 'High' %} bg-danger {% elif task['priority'] == 'Medium' %} bg-warning text-dark {% else %} bg-secondary {% endif %}">
                            {{ task['priority'] }}
                        </span>
                        <p class="card-text text-muted mt-2 small">Created: {{ task['created'] }}</p>
                    </div>
                    <div class="card-footer bg-transparent border-0">
                        <form action="{{ url_for('delete', id=task['id']) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this task?')">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
